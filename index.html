<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QShare - P2P Image Transfer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="py-4 px-4 text-center border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <h1 class="text-xl font-black tracking-wider text-indigo-400">QSHARE <span class="text-xs px-2 py-0.5 bg-indigo-500/20 rounded-full text-indigo-300">P2P</span></h1>
    </header>

    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">

        <!-- Tabs -->
        <div class="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800 shadow-inner">
            <button id="btnSend" onclick="setMode('send')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-indigo-600 text-white transition">1. Send</button>
            <button id="btnReceive" onclick="setMode('receive')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition">2. Receive</button>
        </div>

        <!-- SENDER CARD -->
        <div id="cardSend" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold mb-3 text-indigo-300">Upload JPG to turn into QR</h2>
            <input type="file" id="fileIn" accept="image/jpeg" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer mb-3">
            
            <p id="sendInfo" class="text-xs text-slate-400 mb-3 text-center"></p>
            
            <div id="qrBoxContainer" class="hidden flex flex-col items-center bg-white p-4 rounded-xl">
                <div id="qrcode"></div>
                <p class="text-slate-700 text-xs mt-2 font-semibold text-center">Scan this code or take a screenshot</p>
            </div>
        </div>

        <!-- RECEIVER CARD -->
        <div id="cardReceive" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl hidden">
            <h2 class="text-base font-bold mb-3 text-cyan-300">Scan QR Code</h2>
            
            <!-- Live Camera View -->
            <div id="reader" class="rounded-xl overflow-hidden border border-slate-800 mb-3 bg-black min-h-[220px]"></div>
            
            <!-- Fallback File Uploader for Screenshots -->
            <div class="mt-3 pt-3 border-t border-slate-800 bg-slate-950/50 p-3 rounded-xl border border-slate-800">
                <p class="text-xs text-cyan-400 font-semibold mb-1">💡 Having camera issues?</p>
                <p class="text-xs text-slate-400 mb-2">Upload a screenshot of the sender's QR code instead:</p>
                <input type="file" id="qrFileIn" accept="image/*" class="w-full text-xs text-slate-400 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white cursor-pointer">
            </div>

            <p id="recvStatus" class="text-xs text-slate-400 mt-3 text-center"></p>

            <!-- Final Result -->
            <div id="resultArea" class="hidden mt-4 space-y-3">
                <img id="imgPreview" class="w-full rounded-xl border border-slate-800 max-h-48 object-contain bg-black">
                <a id="downloadLink" download="transferred.jpg" class="block">
                    <button class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition">Download Image</button>
                </a>
            </div>
        </div>

    </main>

    <script>
        let html5QrCode = null;

        function setMode(mode) {
            const cardSend = document.getElementById('cardSend');
            const cardReceive = document.getElementById('cardReceive');
            const btnSend = document.getElementById('btnSend');
            const btnReceive = document.getElementById('btnReceive');

            if (mode === 'send') {
                cardSend.classList.remove('hidden');
                cardReceive.classList.add('hidden');
                btnSend.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-indigo-600 text-white transition";
                btnReceive.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition";
                stopCam();
            } else {
                cardSend.classList.add('hidden');
                cardReceive.classList.remove('hidden');
                btnReceive.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-cyan-600 text-white transition";
                btnSend.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition";
                
                setTimeout(startCam, 300);
            }
        }

        // SENDER LOGIC
        document.getElementById('fileIn').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const sendInfo = document.getElementById('sendInfo');
            sendInfo.innerText = "Processing image...";
            
            const reader = new FileReader();
            reader.onerror = () => { sendInfo.innerText = "Error reading file."; };
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const MAX = 80; // Small grid size to ensure it fits into standard QR limits
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                        const dataUrl = canvas.toDataURL('image/jpeg', 0.3);
                        if (dataUrl.length > 2500) {
                            sendInfo.innerText = "❌ Image payload too large. Choose a simpler photo.";
                            return;
                        }

                        sendInfo.innerText = `✅ QR Ready! (${Math.round(dataUrl.length/1024)} KB)`;
                        const qrcodeDiv = document.getElementById('qrcode');
                        qrcodeDiv.innerHTML = "";
                        
                        new QRCode(qrcodeDiv, { 
                            text: dataUrl, 
                            width: 200, 
                            height: 200,
                            correctLevel: QRCode.CorrectLevel.L
                        });
                        document.getElementById('qrBoxContainer').classList.remove('hidden');
                    } catch (err) {
                        sendInfo.innerText = "❌ Error: " + err.message;
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // RECEIVER CAMERA
        function startCam() {
            const recvStatus = document.getElementById('recvStatus');
            if (!window.Html5Qrcode) {
                recvStatus.innerText = "Scanner library failed to load from CDN.";
                return;
            }

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            if (html5QrCode.isScanning) return;

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess,
                () => {}
            ).catch(err => {
                recvStatus.innerText = "Camera access blocked or unavailable. Use the screenshot uploader below.";
            });
        }

        function stopCam() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(() => {});
            }
        }

        function onScanSuccess(text) {
            if (text && text.startsWith("data:image/jpeg;base64,")) {
                stopCam();
                document.getElementById('recvStatus').innerHTML = "<span class='text-emerald-400 font-bold'>Success! Image received.</span>";
                document.getElementById('imgPreview').src = text;
                document.getElementById('downloadLink').href = text;
                document.getElementById('resultArea').classList.remove('hidden');
            } else {
                document.getElementById('recvStatus').innerText = "⚠️ Scanned code is not a valid QShare image.";
            }
        }

        // Screenshot File Uploader Fallback
        document.getElementById('qrFileIn').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('recvStatus').innerText = "Decoding screenshot...";
            const tempScanner = new Html5Qrcode("reader");
            tempScanner.scanFile(file, true)
                .then(text => {
                    onScanSuccess(text);
                })
                .catch(err => {
                    document.getElementById('recvStatus').innerText = "❌ Could not decode. Ensure it's a clear screenshot.";
                });
        });
    </script>
</body>
</html>
